[package]
name = "aksharamale"
version = "0.1.0"
edition = "2021"
description = "Open-source Kannada Unicode typing engine (KP Rao / KaGaPa phonetic layout)"
license = "MIT"

[dependencies]
[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
